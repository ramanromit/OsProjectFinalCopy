device: "7:9"                    # MAJ:MIN of the loop test disk
cgroup_root: /sys/fs/cgroup/tg
critical: critical
background: background
interval: 1.0
thresholds: {warn: 60, hot: 70, hysteresis: 3}
limits: {warn: 0.8, hot: 0.3}    # fraction of full_speed_mbps allowed for background writes
full_speed_mbps: 2500

# ── Governor settings (Novelty: Predictive Rate-of-Rise dT/dt) ────────
governor:
  mode: "predictive"             # "predictive" (rate-of-rise lookahead) or "reactive" (legacy threshold)
  lookahead_sec: 5.0             # lookahead horizon in seconds (prevents thermal overshoot)
  static_cap: 0.5                # fixed cap fraction for static comparison runs
sensor:
  simulate: true                 # false = try real NVMe sensor first
  hwmon_glob: "/sys/class/nvme/nvme0/hwmon*/temp1_input"
  ambient: 30
  full_load_temp: 85             # equilibrium temp if writing at full speed
  cooling: 0.03                  # cooling rate per second

# ── Auto-classifier settings ──────────────────────────────────────────
classifier:
  scan_interval: 0.8             # seconds between /proc scans
  default_tier: background       # unknown processes default to this tier
  rules:
    # ── Critical (latency-sensitive: games, browsers, databases, servers) ──
    - {pattern: "game",      tier: critical}
    - {pattern: "firefox",   tier: critical}
    - {pattern: "chrome",    tier: critical}
    - {pattern: "chromium",  tier: critical}
    - {pattern: "code",      tier: critical}
    - {pattern: "mysql",     tier: critical}
    - {pattern: "postgres",  tier: critical}
    - {pattern: "mongod",    tier: critical}
    - {pattern: "redis",     tier: critical}
    - {pattern: "nginx",     tier: critical}
    # ── Background (throughput-oriented: backups, copies, downloads) ──
    - {pattern: "rsync",     tier: background}
    - {pattern: "cp",        tier: background}
    - {pattern: "dd",        tier: background}
    - {pattern: "tar",       tier: background}
    - {pattern: "gzip",      tier: background}
    - {pattern: "wget",      tier: background}
    - {pattern: "curl",      tier: background}
    - {pattern: "backup",    tier: background}
    - {pattern: "sync",      tier: background}
    - {pattern: "bulk",      tier: background}
    - {pattern: "fio",       tier: background}
